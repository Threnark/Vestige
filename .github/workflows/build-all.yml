name: Build All Platforms

on:
  push:
    tags:
      - 'v*' # Triggers automatically when you push a version tag (e.g., v1.0.0)
  workflow_dispatch: # Allows manual trigger from the Actions tab on GitHub

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: Vestige-Linux.tar.gz
          - os: macos-latest
            asset: Vestige-macOS.tar.gz
          - os: windows-latest
            asset: Vestige-Windows.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run build script
        shell: bash
        run: |
          # Automatically adapt path separator for Windows vs Unix in your build script if needed
          if [[ "$OSTYPE" == "msys"* ]]; then
            sed -i 's/"assets:assets"/"assets;assets"/g' build_mac_linux.sh
          fi
          bash build_mac_linux.sh

      - name: Archive output (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd dist
          if [[ "${{ matrix.os }}" == 'macos-latest' ]]; then
            tar -czf ../${{ matrix.asset }} Vestige.app
          else
            tar -czf ../${{ matrix.asset }} Vestige
          fi

      - name: Archive output (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd dist
          Compress-Archive -Path Vestige -DestinationPath ../${{ matrix.asset }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}